<div class="tb-card">
  <div class="tb-card__header">
    <div class="tb-title" id="title">Widget Title</div>
    <div class="tb-actions">
      <button class="tb-btn tb-btn--ghost" id="btnRefresh" type="button">Refresh</button>
    </div>
  </div>

  <div class="tb-card__body">
    <div class="tb-grid">
      <div class="tb-metric">
        <div class="tb-metric__label">Status</div>
        <div class="tb-metric__value" id="statusValue">—</div>
      </div>
      <div class="tb-metric">
        <div class="tb-metric__label">RPM</div>
        <div class="tb-metric__value" id="rpmValue">—</div>
      </div>
    </div>

    <div class="tb-divider"></div>

    <div class="tb-note" id="noteArea" aria-live="polite"></div>
  </div>
</div>
